name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native:
    name: Native tests · Rust 1.63
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.63.0 --profile minimal
      - run: cargo +1.63.0 test --locked

  web:
    name: WASM and Chrome regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/m3/package-lock.json
      - run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.85.1 test --locked --manifest-path m3/wasm/Cargo.toml
      - run: sh scripts/build-m3.sh
      - name: Verify staged licenses
        run: |
          cmp LICENSE target/m3-site/LICENSE.txt
          cmp THIRD_PARTY_NOTICES.md target/m3-site/THIRD_PARTY_NOTICES.txt
          cmp web/m3/node_modules/three/LICENSE target/m3-site/THREE-LICENSE.txt
      - run: node scripts/verify-m3.mjs target/m3-site
